name: u10d10_ud_scan_minssplast_worst_accuracy
description: "MINSSPLAST worst-cell accuracy heatmap over U x D, one panel per reservoir method (INPUT, ELM, NGRC, DECSSP)"

data:
  source: store
  filter:
    target_method: [MINSSPLAST]
    reservoir_method: [INPUT, ELM, NGRC, DECSSP]
    metric_name: [value_accuracy_by_cell_min]
    test_size: [5000]  # excludes experiment1/2/4's cached rows at their shared U=10,D=10 cell (they use test_size=2000)

plot:
  type: heatmap
  x: D
  y: U
  facet_col: reservoir_method
  facet_col_order: [INPUT, ELM, NGRC, DECSSP]
  vlim: [0, 1]
  title: "MINSSPLAST worst-cell accuracy vs (U, D)"

output: data/plots/u10d10_ud_scan_minssplast_worst_accuracy.png
